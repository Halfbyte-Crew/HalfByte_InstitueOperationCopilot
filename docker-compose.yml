version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: edupilot-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edupilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edupilot_password}
      POSTGRES_DB: ${POSTGRES_DB:-edupilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edupilot_user} -d ${POSTGRES_DB:-edupilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edupilot-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-edupilot_user}:${POSTGRES_PASSWORD:-edupilot_password}@db:5432/${POSTGRES_DB:-edupilot}
      SECRET_KEY: ${SECRET_KEY:-default_super_secret_key_change_in_production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edupilot-frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
